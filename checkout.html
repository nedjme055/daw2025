<body>
    <header>

        <div>
            <a href="index.html"><img id="logo" src="noire1.png" alt=""></a>
        </div>

        <div>
            <nav>
                <ul>
                    <a href="#"><i class="fi fi-rr-user"></i></a>
                </ul>
            </nav>
        </div>
    </header>

    
<div class="menu-container">
<div class="check-menu">
    <form id="checkout-form">
        <h1>Checkout</h1>
        <label for="name"></label>
        <input type="text" id="name" required  placeholder="Name">

        <label for="last-name"></label>
        <input type="text" id="last-name" required  placeholder="Last Name">


        <label for="address"></label>
        <input type="text" id="address" required placeholder="Shipping Address">

        <label for="payment"></label>
        <select id="payment" required>
            <option value="">Payment Method</option>
            <option value="credit">Credit Card</option>
            <option value="paypal">PayPal</option>
            <option value="cod">Cash on Delivery</option>
        </select>

        <button type="submit">Place Order</button>
        <p id="error-message" style="color: red;"></p>
    </form>
    
</div>
</div>
